<style>
:root{color-scheme:dark;--wood:#2A1708;--wood-line:#1C0F05;--black:#07070C;--panel:#0E1020;--px-border:#3C4166;--px-hi:#6B73A6;
  --ink:#F4F1E6;--ink-muted:#AEB3CC;--gold:#FFD23F;--fire:#FF2E3B;--scan:rgba(0,0,0,.14);
  --font-pixel:"Press Start 2P","Courier New",monospace;--font-body:"Rubik","Helvetica Neue",Arial,sans-serif;
  --gutter:max(16px,env(safe-area-inset-left),env(safe-area-inset-right))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#F4F1E6}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#F4F1E6}
*{box-sizing:border-box}
html{background:var(--wood)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px var(--gutter);color:var(--ink);font-family:var(--font-body);
  background:var(--wood) repeating-linear-gradient(90deg,var(--wood-line) 0 2px,transparent 2px 56px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,var(--scan) 0 2px,transparent 2px 4px)}
.px{position:relative;background:var(--px-border);padding:4px;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),
   calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),
   0 8px,4px 8px,4px 4px,8px 4px)}
.px > .in{background:var(--panel);clip-path:inherit;padding:16px;box-shadow:inset 0 4px 0 var(--px-hi)}
.px-wrap{filter:drop-shadow(4px 4px 0 #000)}
.box{width:100%;max-width:400px}
.box > .px > .in{padding:24px 16px;text-align:center}
h1{font-family:var(--font-pixel);font-size:24px;line-height:1.25;color:var(--gold);text-shadow:4px 4px 0 #000;margin:0;font-weight:400}
.p8{font-family:var(--font-pixel);font-size:8px;line-height:1.5;text-transform:uppercase}
.lab{color:var(--ink-muted);margin:16px 0 12px;display:block}
.field{display:flex;gap:8px}
.field .px{flex:1}
.field .px > .in{padding:0}
input[type=password],input[type=text]{width:100%;height:48px;border:0;background:var(--black);color:var(--ink);padding:0 12px;font-family:var(--font-pixel);font-size:16px;
  -webkit-appearance:none;appearance:none;display:block}
input:focus{outline:4px solid var(--gold);outline-offset:-4px}
.bad .field .px{background:var(--fire)}
.showb{min-width:56px;min-height:56px;font-family:var(--font-pixel);font-size:8px;color:var(--ink);background:none;border:0;cursor:pointer}
.err{color:var(--fire);margin-top:12px;min-height:12px}
.rem{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0;min-height:44px;padding:0 8px;cursor:pointer;font-size:15px}
.rem input{position:absolute;opacity:0;width:1px;height:1px}
.cb{width:24px;height:24px;background:var(--black);border:4px solid var(--px-border);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cb::after{content:"";width:8px;height:8px;background:transparent}
.rem input:checked + .cb::after{background:var(--gold)}
.rem input:focus-visible + .cb{outline:4px solid var(--gold)}
.go{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(4px 4px 0 #000)}
.go .px{background:#8A5A00}
.go .px > .in{background:var(--gold);color:var(--black);min-height:48px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--font-pixel);font-size:16px;padding:8px;box-shadow:inset 0 4px 0 #FFF0A8}
@media (prefers-reduced-motion: no-preference){
  .go:active{transform:translate(4px,4px);filter:none}
  .shake{animation:shake .2s steps(4)}
  .blink{animation:blink 1s steps(1) infinite}
}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes blink{50%{opacity:0}}
.sq{display:inline-block;width:8px;height:8px;background:var(--black)}
.go[disabled]{cursor:wait}
</style>

</main>

<script>
"use strict";
(function () {
  var KEY = "nbawg-v3-pass";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var pw = document.getElementById("pw"), err = document.getElementById("err"), box = document.getElementById("box"), go = document.getElementById("go"), golab = document.getElementById("golab"), rem = document.getElementById("rem");
  function lsGet() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function lsSet(v) { try { if (v == null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, v); } catch (e) {} }
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function decrypt(pass) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]).then(function (km) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
    }).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function busy(on) { go.disabled = on; golab.innerHTML = on ? 'LOADING...<span class="sq blink"></span>' : "UNLOCK"; }
  function wrong() {
    busy(false); box.classList.add("bad"); err.textContent = "WRONG PASSCODE. TRY AGAIN.";
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    pw.focus(); pw.select();
  }
  function open(html) {
    // Keep the #g= game link: the app reads location.hash when it boots.
    var hash = location.hash;
    document.open(); document.write(html); document.close();
    if (hash && location.hash !== hash) { try { history.replaceState(null, "", location.pathname + location.search + hash); } catch (e) {} }
  }
  function attempt(pass, remember, auto) {
    if (!window.crypto || !crypto.subtle) { err.textContent = "THIS BROWSER CANNOT UNLOCK. OPEN THE HTTPS LINK."; return; }
    busy(true);
    decrypt(pass).then(function (html) {
      if (remember) lsSet(pass);
      open(html);
    }, function () {
      if (auto) { lsSet(null); busy(false); pw.focus(); return; }
      wrong();
    });
  }
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!pw.value) { pw.focus(); return; }
    attempt(pw.value, rem.checked, false);
  });
  pw.addEventListener("input", function () { box.classList.remove("bad"); err.textContent = ""; });
  document.getElementById("show").addEventListener("click", function () {
    var on = pw.type === "password"; pw.type = on ? "text" : "password"; this.textContent = on ? "HIDE" : "SHOW"; this.setAttribute("aria-pressed", String(on)); pw.focus();
  });
  var saved = lsGet();
  if (saved) { rem.checked = true; attempt(saved, true, true); } else pw.focus();
})();
</script>
